<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Automotive TierSp</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header>
        <img src="https://i.ibb.co/hJVCzYsj/automotive-Tier-Sp.png" alt="Logo Automotive TierSp" id="logo">
        <h1>
            Automóveis <br>
            TierSp
        </h1>
        <div id="entrar">
        </div>
    </header>
    <main>
        <div id="cadastro">
            <h2>Criar conta</h2>
            <div class="linha">
                <img src="https://static.vecteezy.com/system/resources/thumbnails/022/014/184/small/user-icon-member-login-isolated-vector.jpg" alt="Usuário">
                <div>
                    <label>Nome:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                    <label>E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail">
                </div>
            </div>
            <div class="email">
                <label>Senha:</label>
             <input type="password" id="senha" placeholder="Digite sua senha">
            </div>
            <button id="botaoCadastrar">
                Cadastrar
            </button>
            <button id="botaoVoltar" onclick="window.location.href='index.html'">
    Voltar
</button>
            <p id="mensagem"></p>
        </div>
    </main>
    <footer>
        <div class="rodape">
            <img src="https://i.ibb.co/hJVCzYsj/automotive-Tier-Sp.png" alt="Logo Automotive TierSp">

        </div>
        <div class="rodape">
            <p>
                📍 Setor QNG, Área Especial nº 39,
                <br>
                em Taguatinga Norte
            </p>
            <h3>Contato:</h3>
            <p>
                (61) 3771-9883
            </p>
        </div>
        <div class="rodape">
            <h3>
                Mídias sociais e localização
            </h3>
            <p>📷</p>
            <h3>
                Institucional:
            </h3>
            <p>
                Política de Privacidade
            </p>
        </div>
    </footer>
    <script src="script.js"></script>
</body>
</html>
